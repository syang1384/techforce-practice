name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Unit tests
        run: python -m pytest -v
      - name: Parity with legacy COBOL output
        run: ./check_parity.sh "python3 bencalc.py"

  cobol-oracle:
    # ubuntu:22.04 ships GnuCOBOL 3.1.2, the runtime that produced legacy/expected/*.txt.
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y gnucobol python3 python3-pip
      - run: pip install -r requirements-dev.txt
      - name: Differential fuzz against the COBOL program
        run: python3 fuzz_parity.py --files 600
      - name: Mutation check (every planted bug must be caught)
        run: python3 mutation_check.py --fuzz

  cobol-newer-runtime:
    # GnuCOBOL 3.2 reads malformed files differently (SPEC.md 6.7). Well-formed input must still match.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gnucobol
      - name: Differential fuzz, well-formed records only
        run: python3 fuzz_parity.py --files 600

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t bencalc-api .
      - name: Smoke test container
        run: |
          docker run -d --name api -p 8000:8000 bencalc-api
          for i in $(seq 20); do curl -sf localhost:8000/ >/dev/null && break; sleep 1; done
          curl -sf -X POST localhost:8000/eligibility -H 'content-type: application/json' \
            -d '{"household_size":2,"income":"1795.33","age":60,"state":"TX"}' | tee /dev/stderr \
            | grep -q '"benefit":"75.81"'
