name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Unit tests
        run: python -m pytest -v
      - name: Parity with legacy COBOL output
        run: ./check_parity.sh "python3 bencalc.py"
